<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      /* ============================================
   SADBHAV RENEWABLE ERP — STYLES v5
   Changes from v4:
     1. Colorful (but professional) card theme —
        stat cards, panels, and detail cards now carry
        a soft tinted background + colored left/top accent
        instead of plain white.
     2. Date semantic classes: .sb-date-ontime (green) /
        .sb-date-overdue (red) — used wherever a date is
        rendered (Key Dates, End Date column, Payment due
        dates).
     3. Pipeline stage TAT badge (.sb-stg-tat).
     4. CRM Follow-ups table wrapper now scrollable
        (.sb-fu-scroll).
     5. Removed unused rules tied to Project Status /
        Quick Summary cards (kept generic ones that are
        reused elsewhere e.g. sb-sum-item still used by
        Payment Received / Payment Schedule swap-in).
   ============================================ */

      #sb-wrap {
        display: flex;
        height: 100vh;
        min-height: 600px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #333;
        background: #eef1f8;
        overflow: hidden;
        position: relative;
        transition: all 0.25s ease;
      }

      /* ── MAIN ────────────────── */
      #sb-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }

      #sb-topbar {
        background: #fff;
        border-bottom: 1px solid #e4e6ef;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        min-height: 50px;
        z-index: 10;
      }
      .sb-back-link {
        color: #5e64ff;
        cursor: pointer;
        font-size: 12.5px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .sb-back-link:hover {
        text-decoration: underline;
      }

      /* Search with dropdown */
      #sb-search-wrap {
        flex: 1;
        max-width: 380px;
        position: relative;
      }
      .sb-search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #aaa;
        font-size: 13px;
      }
      #sb-search {
        width: 100%;
        padding: 6px 12px 6px 28px;
        border: 1px solid #e0e3ea;
        border-radius: 20px;
        font-size: 12.5px;
        outline: none;
        color: #555;
        box-sizing: border-box;
      }
      #sb-search:focus {
        border-color: #5e64ff;
        border-radius: 20px 20px 0 0;
      }
      .sb-search-drop {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid #5e64ff;
        border-top: none;
        border-radius: 0 0 10px 10px;
        max-height: 280px;
        overflow-y: auto;
        z-index: 100;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }
      .sb-drop-item {
        padding: 8px 14px;
        cursor: pointer;
        font-size: 12.5px;
        border-bottom: 1px solid #f0f2f8;
        transition: background 0.12s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sb-drop-item:last-child {
        border-bottom: none;
      }
      .sb-drop-item:hover {
        background: #f6f7fb;
      }
      .sb-drop-name {
        font-weight: 600;
        color: #1a2641;
      }
      .sb-drop-cust {
        font-size: 11px;
        color: #8a96b0;
      }
      .sb-drop-badge {
        font-size: 10.5px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 8px;
      }

      #sb-topbar-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .sb-btn-outline {
        padding: 6px 12px;
        border: 1px solid #d0d4e0;
        background: #fff;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        color: #555;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .sb-btn-outline:hover {
        border-color: #5e64ff;
        color: #5e64ff;
      }
      .sb-btn-primary {
        padding: 6px 14px;
        border: none;
        background: linear-gradient(135deg, #5e64ff, #7c82ff);
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        color: #fff;
        font-weight: 600;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .sb-btn-primary:hover {
        background: linear-gradient(135deg, #4a50e6, #6469f0);
      }

      /* ── LIST VIEW ───────────── */
      #sb-list-view {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #sb-list-inner {
        padding: 16px 20px 20px;
      }
      .sb-page-title {
        font-size: 20px;
        font-weight: 700;
        color: #1a2641;
        margin: 0 0 14px;
      }

      .sb-stat-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .sb-stat-row2 {
        margin-bottom: 14px;
      }

      /* ── COLORFUL STAT CARDS ──────────────────────
   Each card gets a tinted background + a colored
   top accent bar (via border-top) so the dashboard
   reads as intentionally themed rather than plain white. */
      .sb-stat {
        background: #fff;
        border: 1px solid #e4e6ef;
        border-top: 3px solid #d0d4e0;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
        flex: 1;
        min-width: 130px;
        transition:
          box-shadow 0.2s,
          transform 0.15s;
      }
      .sb-stat:hover {
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.09);
        transform: translateY(-1px);
      }
      .sb-stat-wide {
        min-width: 200px;
        flex: 1.4;
      }

      /* Tint each stat card by its icon-box color context */
      .sb-stat:has(.si-grey) {
        background: #f8f9fc;
        border-top-color: #8a96b0;
      }
      .sb-stat:has(.si-green) {
        background: #eefaf1;
        border-top-color: #22a959;
      }
      .sb-stat:has(.si-red) {
        background: #fdeeee;
        border-top-color: #dc3545;
      }
      .sb-stat:has(.si-blue) {
        background: #eef5fd;
        border-top-color: #2670e8;
      }
      .sb-stat:has(.si-amber) {
        background: #fef9ec;
        border-top-color: #e8a020;
      }
      .sb-stat:has(.si-orange) {
        background: #fff3e8;
        border-top-color: #fd7e14;
      }

      .sb-stat-icon-box {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .si-grey {
        background: #e6e9f0;
      }
      .si-green {
        background: #d5f0dd;
      }
      .si-red {
        background: #fbd8d8;
      }
      .si-blue {
        background: #d6e8fb;
      }
      .si-amber {
        background: #fbedc4;
      }
      .si-orange {
        background: #ffe1c7;
      }
      .sb-stat-val {
        font-size: 20px;
        font-weight: 700;
        color: #1a2641;
        line-height: 1.1;
      }
      .sb-stat-lbl {
        font-size: 11px;
        color: #8a96b0;
        margin-top: 1px;
      }
      .sb-stat-sub {
        font-size: 11.5px;
        color: #5a6070;
        font-weight: 500;
        margin-top: 1px;
      }
      .clr-green {
        color: #22a959;
      }
      .clr-red {
        color: #dc3545;
      }
      .clr-blue {
        color: #2670e8;
      }
      .clr-amber {
        color: #e8a020;
      }
      .clr-orange {
        color: #fd7e14;
      }

      #sb-filter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sb-tabs {
        display: flex;
        gap: 3px;
        background: #fff;
        border: 1px solid #e4e6ef;
        border-radius: 7px;
        padding: 3px;
      }
      .sb-tab {
        padding: 4px 13px;
        border: none;
        background: transparent;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        color: #666;
        transition: all 0.15s;
      }
      .sb-tab.sb-tab-active {
        background: #1a2641;
        color: #fff;
      }
      .sb-tab:hover:not(.sb-tab-active) {
        background: #f0f1f5;
      }
      .sb-filter-right {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      /* Table compact */
      .sb-table-wrap {
        background: #fff;
        border: 1px solid #e4e6ef;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 14px;
        max-height: 300px;
        overflow-y: auto;
      }
      .sb-table-wrap::-webkit-scrollbar {
        width: 5px;
      }
      .sb-table-wrap::-webkit-scrollbar-thumb {
        background: #d0d4e0;
        border-radius: 3px;
      }
      #sb-proj-table {
        width: 100%;
        border-collapse: collapse;
      }
      #sb-proj-table thead {
        position: sticky;
        top: 0;
        z-index: 2;
      }
      #sb-proj-table thead th {
        background: #eef1fb;
        padding: 8px 11px;
        text-align: left;
        font-size: 11.5px;
        color: #5e64ff;
        font-weight: 700;
        border-bottom: 1px solid #e4e6ef;
        white-space: nowrap;
      }
      #sb-proj-table tbody tr {
        border-bottom: 1px solid #f0f2f8;
        cursor: pointer;
        transition: background 0.12s;
      }
      #sb-proj-table tbody tr:hover {
        background: #f6f7fb;
      }
      #sb-proj-table tbody tr:last-child {
        border-bottom: none;
      }
      #sb-proj-table tbody td {
        padding: 7px 11px;
        font-size: 12px;
        vertical-align: middle;
      }

      .sb-loading-row {
        text-align: center;
        padding: 28px;
        color: #aaa;
        font-size: 13px;
      }
      .sb-loading-sm {
        color: #aaa;
        font-size: 12px;
        padding: 6px 0;
      }
      .sb-proj-id {
        font-weight: 600;
        color: #1a2641;
        font-size: 12px;
      }
      .sb-proj-sub {
        font-size: 11px;
        color: #aaa;
        margin-top: 2px;
      }
      .sb-cust-name {
        font-weight: 500;
        color: #333;
        font-size: 12px;
      }
      .sb-cust-loc {
        font-size: 11px;
        color: #aaa;
      }
      .sb-prog-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .sb-prog-bg {
        width: 70px;
        height: 5px;
        background: #e8e8e8;
        border-radius: 3px;
        overflow: hidden;
      }
      .sb-prog-fill {
        height: 100%;
        border-radius: 3px;
      }
      .pf-green {
        background: #22a959;
      }
      .pf-blue {
        background: #2670e8;
      }
      .pf-orange {
        background: #fd7e14;
      }
      .pf-gray {
        background: #bbb;
      }

      .sb-pending-amt {
        text-align: right;
        font-size: 12px;
        color: #555;
      }
      .sb-more-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: #aaa;
        font-size: 16px;
        padding: 0 4px;
      }
      .sb-more-btn:hover {
        color: #555;
      }

      /* ── SEMANTIC DATE COLORING ─────────────────
   Applied to any rendered date value: green = on time /
   within SLA, red = overdue / breached SLA. */
      .sb-date-ontime {
        color: #1e8e3e;
        font-weight: 600;
      }
      .sb-date-overdue {
        color: #dc3545;
        font-weight: 700;
      }
      .sb-date-neutral {
        color: #333;
        font-weight: 500;
      }

      /* ── BOTTOM PANELS ─── */
      #sb-bottom-panels {
        display: flex;
        gap: 12px;
        flex-wrap: nowrap;
        min-height: 130px;
      }
      .sb-panel {
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        border: 1px solid #e4e6ef;
      }

      .sb-pay-overview-panel {
        background: #eef0ff;
        border-top: 3px solid #5e64ff;
      }
      .sb-sites-panel {
        background: #eaf7ee;
        border-top: 3px solid #22a959;
      }
      .sb-qs-panel {
        background: #fef7e8;
        border-top: 3px solid #e8a020;
      }

      .sb-panel-hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-weight: 700;
        font-size: 13px;
        color: #1a2641;
      }
      .sb-link-btn {
        background: none;
        border: none;
        color: #5e64ff;
        cursor: pointer;
        font-size: 12px;
        padding: 0;
      }
      .sb-link-btn:hover {
        text-decoration: underline;
      }

      /* Payment overview */
      .sb-pay-row {
        display: flex;
        gap: 0;
      }
      .sb-pay-col {
        text-align: center;
        flex: 1;
        padding: 4px 0;
      }
      .sb-pay-val {
        font-size: 18px;
        font-weight: 700;
        color: #1a2641;
        cursor: pointer;
        line-height: 1.2;
      }
      .sb-pay-val:hover {
        text-decoration: underline;
      }
      .sb-pay-lbl {
        font-size: 11px;
        color: #8a96b0;
        margin-top: 2px;
      }
      .sb-pay-divider {
        width: 1px;
        background: #d6dbf5;
        margin: 4px 0;
      }

      /* ── DETAIL VIEW ─────────── */
      #sb-detail-view {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #sb-detail-inner {
        padding-bottom: 30px;
      }

      .sb-d-topbar {
        background: #fff;
        border-bottom: 1px solid #e4e6ef;
        padding: 11px 20px;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .sb-d-title {
        font-size: 17px;
        font-weight: 700;
        color: #1a2641;
      }

      /* Status badges */
      .db-complete {
        background: #e6f4ea !important;
        color: #1e8e3e !important;
        border: 1px solid #a8d5b5 !important;
        padding: 4px 10px !important;
        border-radius: 12px !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 4px !important;
        white-space: nowrap !important;
      }
      .db-open {
        background: #e8f0fe !important;
        color: #1a73e8 !important;
        border: 1px solid #d2e3fc !important;
        padding: 4px 10px !important;
        border-radius: 12px !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 4px !important;
        white-space: nowrap !important;
      }
      .db-delayed {
        background: #fff3e0 !important;
        color: #fd7e14 !important;
        border: 1px solid #ffc07a !important;
        padding: 4px 10px !important;
        border-radius: 12px !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 4px !important;
        white-space: nowrap !important;
      }
      .db-cancelled {
        background: #fce8e6 !important;
        color: #d93025 !important;
        border: 1px solid #fad2cf !important;
        padding: 4px 10px !important;
        border-radius: 12px !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 4px !important;
        white-space: nowrap !important;
      }

      .db-cash {
        background: #fff8e1;
        color: #e8a020;
        border: 1px solid #ffc107;
        padding: 3px 11px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .sb-d-meta {
        font-size: 12px;
        color: #7a8099;
        display: flex;
        flex-wrap: wrap;
      }
      .sb-d-meta span {
        margin-right: 14px;
      }
      .sb-d-meta strong {
        color: #333;
      }
      .sb-d-dl-btn {
        margin-left: auto;
        padding: 6px 13px;
        border: 1px solid #d0d4e0;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        color: #555;
        white-space: nowrap;
      }
      .sb-d-dl-btn:hover {
        border-color: #5e64ff;
        color: #5e64ff;
      }
      .sb-d-open-btn {
        padding: 6px 13px;
        border: 1px solid #5e64ff;
        background: linear-gradient(135deg, #5e64ff, #7c82ff);
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        color: #fff;
        white-space: nowrap;
      }
      .sb-d-open-btn:hover {
        background: linear-gradient(135deg, #4a50e6, #6469f0);
      }

      /* Pipeline */
      .sb-pipeline {
        background: #f7f8fd;
        border-bottom: 1px solid #e4e6ef;
        padding: 16px 20px;
      }
      .sb-stages {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        width: 100%;
      }
      .sb-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        cursor: pointer;
        transition: opacity 0.15s;
        position: relative;
        min-width: 0;
      }
      .sb-stage:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 16px;
        left: calc(50% + 16px);
        right: calc(-50% + 16px);
        height: 2px;
        background: #d6dbf0;
        z-index: 0;
      }
      .sb-stage.stg-done:not(:last-child)::after {
        background: #22a959;
      }
      .sb-stage.stg-done.stg-breached:not(:last-child)::after {
        background: #dc3545;
      }
      .sb-stage.stg-disabled {
        cursor: default;
        opacity: 0.55;
      }
      .sb-stage:not(.stg-disabled):hover {
        opacity: 0.8;
      }

      .sb-stg-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #e8ecf5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        margin-bottom: 5px;
        font-weight: 600;
        color: #7a8099;
        position: relative;
        z-index: 1;
        flex-shrink: 0;
      }
      .sb-stage.stg-done .sb-stg-circle {
        background: #e6f4ea;
        color: #22a959;
        font-size: 15px;
        border: 2px solid #a8d5b5;
      }
      .sb-stage.stg-current .sb-stg-circle {
        background: #e3f0fd;
        color: #2670e8;
        box-shadow: 0 0 0 3px rgba(38, 112, 232, 0.15);
      }
      /* Done but breached SLA -> red, per request */
      .sb-stage.stg-done.stg-breached .sb-stg-circle {
        background: #fde8e8;
        color: #dc3545;
        border: 2px solid #f3a9a9;
      }

      .sb-stg-name {
        font-size: 10.5px;
        font-weight: 600;
        color: #333;
        text-align: center;
        line-height: 1.2;
      }
      .sb-stg-sub {
        font-size: 9.5px;
        color: #aaa;
        text-align: center;
      }

      /* TAT badge shown under each stage */
      .sb-stg-tat {
        font-size: 9px;
        font-weight: 700;
        text-align: center;
        margin-top: 3px;
        padding: 1px 6px;
        border-radius: 8px;
        display: inline-block;
        background: #eef0ff;
        color: #5e64ff;
      }
      .sb-stage.stg-done .sb-stg-tat {
        background: #e6f4ea;
        color: #1e8e3e;
      }
      .sb-stage.stg-done.stg-breached .sb-stg-tat {
        background: #fde8e8;
        color: #dc3545;
      }

      /* Delay alerts */
      .sb-alerts-bar {
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 8px;
        padding: 10px 16px;
        margin: 12px 20px;
        font-size: 12px;
        position: relative;
      }
      .sb-alerts-title {
        font-weight: 600;
        color: #e8a020;
        margin-bottom: 6px;
      }
      .sb-alert-item {
        color: #666;
        margin-bottom: 3px;
        padding-left: 14px;
        position: relative;
      }
      .sb-alert-item::before {
        content: "●";
        position: absolute;
        left: 0;
        color: #dc3545;
      }
      .sb-view-analysis {
        position: absolute;
        right: 14px;
        bottom: 10px;
        font-size: 12px;
        color: #5e64ff;
        cursor: pointer;
      }
      .sb-view-analysis:hover {
        text-decoration: underline;
      }

      /* Detail grid — 4 columns */
      .sb-d-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        padding: 12px 20px;
        align-items: start;
      }

    </style>
  </head>
